<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fixture: color contrast</title>
    <style>
      body { background: #ffffff; color: #111; font-family: sans-serif; }
      .low { color: #bbbbbb; background: transparent; }   /* against white => fails */
      .ok  { color: #222222; background: transparent; }   /* against white => passes */
      .large-bold { color: #777; font-size: 19px; font-weight: 700; }  /* large bold */
    </style>
  </head>
  <body>
    <main>
      <h1>Color contrast fixture</h1>
      <p class="low">Low contrast (#bbb on white) — should fail.</p>
      <p class="ok">Acceptable contrast (#222 on white) — should pass.</p>
      <p class="large-bold">Large bold text — borderline 3:1 — passes if >= 3:1.</p>
    </main>
  </body>
</html>
